[project]
name = "smart-vision"
version = "0.1.0"
description = "Transforms ordinary CCTV cameras into intelligent home safety assistants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0",
    "numpy>=2.0.0",
    "ultralytics==8.4.131",
    "PyQt5",
    "insightface==2.1.0",
    "onnxruntime==1.31.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = "."
markers = [
    "integration: requires local model weights or sample media",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
